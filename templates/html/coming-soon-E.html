<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coming Soon E — Cream Symmetry</title>
<link rel="stylesheet" href="{{google_fonts_url}}">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: {{surface_color}}; }
  #canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: {{surface_color}};
    overflow: hidden;
    font-family: {{body_font_stack}};
    color: {{text_color}};
  }
  #canvas img { display: block; }
  #canvas span { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="canvas" data-template="coming-soon-E" data-width="1080" data-height="1350">

  <!-- brand logo centered top (zone A: 56-172) -->
  <img src="{{brand_logo_dark}}" style="position:absolute;left:50%;top:68px;transform:translateX(-50%);width:480px;height:auto;" />

  <!-- eyebrow label (zone B: 180-220) -->
  <div style="position:absolute;left:0;top:186px;width:1080px;height:24px;font-family:{{body_font_stack}};font-size:17px;font-weight:900;letter-spacing:7px;text-transform:uppercase;color:{{accent_color}};display:flex;align-items:center;justify-content:center;">
    <span>A Private Preview</span>
  </div>

  <!-- ornamental rule with diamond -->
  <div style="position:absolute;left:0;top:228px;width:1080px;height:12px;display:flex;align-items:center;justify-content:center;gap:14px;">
    <div style="width:70px;height:1px;background:{{primary_color}};"></div>
    <div style="width:10px;height:10px;background:{{primary_color}};transform:rotate(45deg);"></div>
    <div style="width:70px;height:1px;background:{{primary_color}};"></div>
  </div>

  <!-- display headline (zone C: 260-430) -->
  <div style="position:absolute;left:0;top:260px;width:1080px;height:170px;font-family:{{heading_font_stack}};font-size:160px;font-weight:500;font-style:italic;line-height:1;color:{{primary_color}};display:flex;align-items:center;justify-content:center;" data-layer="status-headline" data-field="status_text">
    <span>{{status_text}}</span>
  </div>

  <!-- hero photo card (zone D: 460-1000, 540px tall) -->
  <div style="position:absolute;left:60px;top:460px;width:960px;height:540px;padding:16px;background:#FFFFFF;box-shadow:0 30px 60px rgba(0,0,0,0.12);box-sizing:border-box;">
    <div style="width:100%;height:100%;overflow:hidden;" data-layer="main-image" data-field="main_photo">
      <img src="{{main_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center 65%;" />
    </div>
  </div>

  <!-- inset photos (zone E: 1035-1155, 120px tall) -->
  <div style="position:absolute;left:160px;top:1035px;width:370px;height:120px;overflow:hidden;" data-layer="interior" data-field="interior_photo">
    <img src="{{interior_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
  </div>
  <div style="position:absolute;left:550px;top:1035px;width:370px;height:120px;overflow:hidden;" data-layer="secondary" data-field="secondary_photo">
    <img src="{{secondary_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
  </div>

  <!-- address + features (zone F: 1180-1278) -->
  <div style="position:absolute;left:60px;top:1184px;width:960px;height:38px;font-family:{{body_font_stack}};font-size:30px;font-weight:700;letter-spacing:4.5px;text-transform:uppercase;color:{{text_color}};display:flex;align-items:center;justify-content:center;overflow:hidden;" data-layer="address" data-field="address">
    <span>{{address}}</span>
  </div>
  <div style="position:absolute;left:60px;top:1232px;width:960px;height:38px;font-family:{{heading_font_stack}};font-size:32px;font-weight:400;font-style:italic;color:{{primary_soft_color}};display:flex;align-items:center;justify-content:center;overflow:hidden;" data-layer="features" data-field="features">
    <span>{{features}}</span>
  </div>

  <!-- footer rail (zone G: 1290-1350) -->
  <div style="position:absolute;left:0;top:1290px;width:1080px;height:60px;background:{{primary_color}};display:flex;align-items:center;justify-content:center;gap:30px;font-family:{{body_font_stack}};font-size:16px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:{{surface_alt_color}};">
    <span data-layer="phone" data-field="phone"><span>{{phone}}</span></span>
    <span style="color:{{accent_color}};">◆</span>
    <span data-layer="email" data-field="email"><span>{{email}}</span></span>
    <span style="color:{{accent_color}};">◆</span>
    <span data-layer="website" data-field="website"><span>{{website}}</span></span>
  </div>

</div>
</body>
</html>
