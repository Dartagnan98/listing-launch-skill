<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Just Listed E — Sage Classifieds</title>
<link rel="stylesheet" href="{{google_fonts_url}}">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: {{surface_tint_color}}; }
  #canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: {{surface_tint_color}};
    overflow: hidden;
    font-family: {{body_font_stack}};
    color: {{primary_color}};
  }
  #canvas img { display: block; }
  #canvas span { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="canvas" data-template="just-listed-E" data-width="1080" data-height="1350">

  <!-- brand logo centered top (zone A: 56-162) -->
  <img src="{{brand_logo_dark}}" style="position:absolute;left:50%;top:60px;transform:translateX(-50%);width:440px;height:auto;" />

  <!-- top banner: stage label left, price right (zone B: 186-300) -->
  <div style="position:absolute;left:60px;top:186px;width:600px;height:110px;font-family:{{heading_font_stack}};font-size:98px;font-weight:500;font-style:italic;line-height:1;color:{{primary_color}};display:flex;align-items:center;" data-layer="status-headline" data-field="status_text">
    <span>{{status_text}}.</span>
  </div>
  <div style="position:absolute;right:60px;top:200px;width:420px;height:90px;font-family:{{heading_font_stack}};font-size:72px;font-weight:700;color:{{accent_color}};display:flex;align-items:center;justify-content:flex-end;" data-layer="price" data-field="price">
    <span>{{price}}</span>
  </div>

  <!-- hairline separator -->
  <div style="position:absolute;left:60px;top:326px;width:960px;height:1px;background:{{primary_color}};opacity:0.3;"></div>

  <!-- address + features under hairline (zone C: 350-450) -->
  <div style="position:absolute;left:60px;top:350px;width:960px;height:42px;font-family:{{body_font_stack}};font-size:28px;font-weight:700;letter-spacing:4.5px;text-transform:uppercase;color:{{text_color}};display:flex;align-items:center;overflow:hidden;" data-layer="address" data-field="address">
    <span>{{address}}</span>
  </div>
  <div style="position:absolute;left:60px;top:400px;width:960px;height:42px;font-family:{{heading_font_stack}};font-size:32px;font-weight:400;font-style:italic;color:{{primary_color}};display:flex;align-items:center;overflow:hidden;" data-layer="features" data-field="features">
    <span>{{features}}</span>
  </div>

  <!-- hero photo framed card (zone D: 478-1000, 522px tall) -->
  <div style="position:absolute;left:60px;top:478px;width:960px;height:522px;padding:14px;background:#FFFFFF;box-sizing:border-box;box-shadow:0 24px 48px rgba(4,75,53,0.15);">
    <div style="width:100%;height:100%;overflow:hidden;" data-layer="main-image" data-field="main_photo">
      <img src="{{main_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center 65%;" />
    </div>
  </div>

  <!-- two inset photos side-by-side (zone E: 1030-1250, 220px tall) -->
  <div style="position:absolute;left:60px;top:1030px;width:470px;height:220px;overflow:hidden;border:10px solid #FFFFFF;box-sizing:border-box;" data-layer="interior" data-field="interior_photo">
    <img src="{{interior_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
  </div>
  <div style="position:absolute;left:550px;top:1030px;width:470px;height:220px;overflow:hidden;border:10px solid #FFFFFF;box-sizing:border-box;" data-layer="secondary" data-field="secondary_photo">
    <img src="{{secondary_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
  </div>

  <!-- footer rail (zone F: 1290-1350) -->
  <div style="position:absolute;left:0;top:1290px;width:1080px;height:60px;background:{{primary_color}};display:flex;align-items:center;justify-content:center;gap:30px;font-family:{{body_font_stack}};font-size:16px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:{{surface_alt_color}};">
    <span data-layer="phone" data-field="phone"><span>{{phone}}</span></span>
    <span style="color:{{accent_color}};">◆</span>
    <span data-layer="email" data-field="email"><span>{{email}}</span></span>
    <span style="color:{{accent_color}};">◆</span>
    <span data-layer="website" data-field="website"><span>{{website}}</span></span>
  </div>

</div>
</body>
</html>
