<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Just Listed D — Magazine Cover</title>
<link rel="stylesheet" href="{{google_fonts_url}}">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: {{surface_alt_color}}; }
  #canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: {{surface_alt_color}};
    overflow: hidden;
    font-family: {{body_font_stack}};
    color: {{text_color}};
  }
  #canvas img { display: block; }
  #canvas span { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="canvas" data-template="just-listed-D" data-width="1080" data-height="1350">

  <!-- hero photo full-bleed top (zone A: 0-720) -->
  <div style="position:absolute;left:0;top:0;width:1080px;height:720px;overflow:hidden;" data-layer="main-image" data-field="main_photo">
    <img src="{{main_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center 65%;" />
  </div>

  <!-- dark gradient wash at top of hero for logo legibility -->
  <div style="position:absolute;left:0;top:0;width:1080px;height:220px;background:linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 70%, rgba(0,0,0,0) 100%);"></div>

  <!-- dark gradient wash at bottom of hero for label legibility -->
  <div style="position:absolute;left:0;top:540px;width:1080px;height:180px;background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(4,75,53,0.75) 100%);"></div>

  <!-- brand logo top-left (inverted to white) -->
  <img src="{{brand_logo}}" style="position:absolute;left:60px;top:56px;width:240px;height:auto;filter:brightness(0) invert(1);" />

  <!-- top-right eyebrow pill (light) -->
  <div style="position:absolute;right:60px;top:72px;height:44px;padding:0 22px;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;font-family:{{body_font_stack}};font-size:17px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:{{primary_color}};">
    <span>Just Listed</span>
  </div>

  <!-- accent price pill, bottom-right of hero -->
  <div style="position:absolute;right:60px;top:616px;height:80px;padding:0 36px;background:{{accent_color}};display:flex;align-items:center;justify-content:center;font-family:{{heading_font_stack}};font-size:48px;font-weight:700;color:#FFFFFF;letter-spacing:1px;" data-layer="price" data-field="price">
    <span>{{price}}</span>
  </div>

  <!-- stage label script (zone B: 760-860) -->
  <div style="position:absolute;left:60px;top:760px;width:960px;height:100px;font-family:{{heading_font_stack}};font-size:96px;font-weight:500;font-style:italic;line-height:1;color:{{primary_color}};display:flex;align-items:center;" data-layer="status-headline" data-field="status_text">
    <span>{{status_text}}.</span>
  </div>

  <!-- accent hairline rule -->
  <div style="position:absolute;left:60px;top:890px;width:100px;height:4px;background:{{accent_color}};"></div>

  <!-- address (zone C: 920-970) -->
  <div style="position:absolute;left:60px;top:920px;width:960px;height:46px;font-family:{{body_font_stack}};font-size:32px;font-weight:700;letter-spacing:4.5px;text-transform:uppercase;color:{{text_color}};display:flex;align-items:center;overflow:hidden;" data-layer="address" data-field="address">
    <span>{{address}}</span>
  </div>

  <!-- features line in heading-font italic -->
  <div style="position:absolute;left:60px;top:978px;width:960px;height:46px;font-family:{{heading_font_stack}};font-size:36px;font-weight:400;font-style:italic;color:{{primary_soft_color}};display:flex;align-items:center;overflow:hidden;" data-layer="features" data-field="features">
    <span>{{features}}</span>
  </div>

  <!-- two inset photos (zone D: 1060-1270, 210px tall) -->
  <div style="position:absolute;left:60px;top:1060px;width:470px;height:210px;overflow:hidden;" data-layer="interior" data-field="interior_photo">
    <img src="{{interior_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
  </div>
  <div style="position:absolute;left:550px;top:1060px;width:470px;height:210px;overflow:hidden;" data-layer="secondary" data-field="secondary_photo">
    <img src="{{secondary_photo}}" style="width:100%;height:100%;object-fit:cover;object-position:center;" />
  </div>

  <!-- footer rail (zone E: 1290-1350) -->
  <div style="position:absolute;left:0;top:1290px;width:1080px;height:60px;background:{{primary_color}};display:flex;align-items:center;justify-content:center;gap:36px;font-family:{{body_font_stack}};font-size:16px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:{{surface_alt_color}};">
    <span data-layer="phone" data-field="phone"><span>{{phone}}</span></span>
    <span style="opacity:0.5;">·</span>
    <span data-layer="email" data-field="email"><span>{{email}}</span></span>
    <span style="opacity:0.5;">·</span>
    <span data-layer="website" data-field="website"><span>{{website}}</span></span>
  </div>

</div>
</body>
</html>
